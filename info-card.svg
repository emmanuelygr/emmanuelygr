<svg xmlns="http://www.w3.org/2000/svg"
     width="520"
     height="420"
     viewBox="0 0 520 420"
     role="img"
     aria-label="Emmanuel Galicia cybersecurity profile">

  <rect width="520" height="420" rx="14" fill="#0d1117"/>

  <!-- terminal window -->
  <rect x="16" y="16" width="488" height="388"
        rx="12"
        fill="#010409"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- header -->
  <rect x="16" y="16" width="488" height="42"
        rx="12"
        fill="#161b22"/>

  <circle cx="39" cy="37" r="5" fill="#8b949e"/>
  <circle cx="57" cy="37" r="5" fill="#8b949e"/>
  <circle cx="75" cy="37" r="5" fill="#8b949e"/>

  <text x="260" y="41"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    emmanuel@github: ~/profile
  </text>

  <!-- command -->
  <text x="38" y="88"
        font-family="monospace"
        font-size="15"
        fill="#58a6ff">
    $ cat profile.txt
  </text>

  <!-- identity -->
  <text class="line line1"
        x="38" y="122"
        font-family="monospace"
        font-size="21"
        font-weight="bold"
        fill="#c9d1d9">
    Emmanuel Galicia
  </text>

  <text class="line line2"
        x="38" y="148"
        font-family="monospace"
        font-size="14"
        fill="#8b949e">
    Aspiring Cybersecurity Professional
  </text>

  <!-- divider -->
  <line x1="38" y1="166" x2="482" y2="166"
        stroke="#30363d"/>

  <!-- focus -->
  <text class="line line3"
        x="38" y="194"
        font-family="monospace"
        font-size="14"
        fill="#58a6ff">
    Focus
  </text>

  <text class="line line4"
        x="55" y="218"
        font-family="monospace"
        font-size="13"
        fill="#c9d1d9">
    SOC / Security Operations
  </text>

  <!-- stack -->
  <text class="line line5"
        x="38" y="250"
        font-family="monospace"
        font-size="14"
        fill="#58a6ff">
    Stack
  </text>

  <text class="line line6"
        x="55" y="274"
        font-family="monospace"
        font-size="13"
        fill="#c9d1d9">
    Linux · Networking &amp; HTTP · Python
  </text>

  <text class="line line7"
        x="55" y="296"
        font-family="monospace"
        font-size="13"
        fill="#c9d1d9">
    SQL · SIEM · Web Security
  </text>

  <!-- platforms -->
  <text class="line line8"
        x="38" y="328"
        font-family="monospace"
        font-size="14"
        fill="#58a6ff">
    Platforms
  </text>

  <text class="line line9"
        x="55" y="352"
        font-family="monospace"
        font-size="13"
        fill="#c9d1d9">
    Hack The Box · TryHackMe
  </text>

  <!-- location / languages -->
  <text class="line line10"
        x="38" y="380"
        font-family="monospace"
        font-size="12"
        fill="#8b949e">
    Germany · Spanish / English
  </text>

  <style>
    .line {
      opacity: 0;
      animation: reveal 0.45s ease-out forwards;
    }

    .line1  { animation-delay: 0.25s; }
    .line2  { animation-delay: 0.45s; }
    .line3  { animation-delay: 0.65s; }
    .line4  { animation-delay: 0.85s; }
    .line5  { animation-delay: 1.05s; }
    .line6  { animation-delay: 1.25s; }
    .line7  { animation-delay: 1.45s; }
    .line8  { animation-delay: 1.65s; }
    .line9  { animation-delay: 1.85s; }
    .line10 { animation-delay: 2.05s; }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

</svg>
