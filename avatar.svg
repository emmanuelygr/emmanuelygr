<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="420"
     viewBox="0 0 420 420"
     role="img"
     aria-label="Anonymous cybersecurity avatar">

  <rect width="420" height="420" rx="18" fill="#0d1117"/>

  <!-- terminal frame -->
  <rect x="18" y="18" width="384" height="384"
        rx="14"
        fill="none"
        stroke="#30363d"
        stroke-width="2"/>

  <!-- terminal dots -->
  <circle cx="42" cy="43" r="5" fill="#8b949e"/>
  <circle cx="60" cy="43" r="5" fill="#8b949e"/>
  <circle cx="78" cy="43" r="5" fill="#8b949e"/>

  <!-- anonymous head -->
  <g fill="none"
     stroke="#c9d1d9"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="
      M210 92
      C145 92 105 135 105 205
      C105 270 145 315 210 315
      C275 315 315 270 315 205
      C315 135 275 92 210 92
      Z"/>

    <!-- shoulders -->
    <path d="
      M105 315
      C62 330 45 352 38 382
      M315 315
      C358 330 375 352 382 382
      M105 315
      C135 337 165 347 210 347
      C255 347 285 337 315 315"/>

  </g>

  <!-- question mark -->
  <text x="210"
        y="245"
        text-anchor="middle"
        font-family="monospace"
        font-size="105"
        font-weight="bold"
        fill="#58a6ff">
    ?
  </text>

  <!-- blinking cursor -->
  <rect x="247" y="270" width="12" height="5" fill="#58a6ff">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

  <!-- subtle draw-in animation -->
  <style>
    .draw {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 2.5s ease-out forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

</svg>
